name: Project Board Automation

on:
  issues:
    types: [opened, assigned, closed, reopened]
  pull_request:
    types: [opened, converted_to_draft, ready_for_review, closed]
  pull_request_review:
    types: [submitted]

jobs:
  update-project:
    runs-on: ubuntu-latest
    steps:
      - name: Update project board
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/${{ github.repository_owner }}/projects/7
          github-token: ${{ secrets.GITHUB_TOKEN }}

  auto-label-by-path:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Label based on changed files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const labels = new Set();
            
            for (const file of files) {
              // Core Application
              if (file.filename.startsWith('src/app')) labels.add('frontend');
              if (file.filename.startsWith('src/components')) labels.add('frontend');
              if (file.filename.startsWith('src/lib')) labels.add('backend'); // Utils/Logic
              
              // Features
              if (file.filename.includes('messages/')) labels.add('documentation'); // i18n
              if (file.filename.includes('middleware.ts')) labels.add('security');
              
              // Infra
              if (file.filename.startsWith('.github')) labels.add('infrastructure');
              if (file.filename.startsWith('docs')) labels.add('documentation');
            }
            
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels)
              });
            }

  notify-ready-for-review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && 
      github.event.action == 'ready_for_review'
    steps:
      - name: Add ready-for-review label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ready-for-review']
            });
